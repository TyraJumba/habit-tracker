10px}.headrow h1{font:700 clamp(28px,3.4vw,38px) Manrope,sans-serif;letter-spacing:-1.5px;margin:0}.sub{color:var(--muted);margin:9px 0 0}.primary{border:0;border-radius:10px;background:var(--brand);color:#fff;padding:12px 17px;font-weight:700;box-shadow:0 4px 10px #4f46e52b;transition:.18s}.primary:hover{background:var(--branddark);transform:translateY(-1px)}.primary:disabled{opacity:.45;cursor:not-allowed;transform:none}.grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(260px,.9fr);gap:20px}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow)}.focus-card{padding:23px 24px 16px}.cardhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.cardhead h2{font:700 16px Manrope,sans-serif;margin:0;letter-spacing:-.3px}.date-label{color:var(--muted);font-size:13px}.progress-row{display:flex;align-items:center;gap:11px;margin-bottom:20px}.track{height:7px;background:#eef0f5;border-radius:8px;overflow:hidden;flex:1}.track span{height:100%;display:block;background:linear-gradient(90deg,#6366f1,#14b8a6);border-radius:8px;transition:width .4s}.pct{font-size:13px;font-weight:700;color:#4f46e5;min-width:35px;text-align:right}.habit-list{display:grid}.habit{min-height:74px;border-top:1px solid #f0f2f6;display:flex;align-items:center;gap:14px;padding:10px 4px;transition:.2s}.check{width:25px;height:25px;border-radius:8px;border:1.5px solid #cbd5e1;background:white;display:grid;place-items:center;color:white;flex:none;transition:.2s}.check:hover{border-color:var(--brand);background:#f5f3ff}.check.done{background:var(--brand);border-color:var(--brand);animation:pop .25s ease}.check.done svg{width:15px}.habit-info{flex:1;min-width:0}.habit-title{font-weight:600}.habit-meta{font-size:12px;color:var(--muted);margin-top:5px}.habit.done .habit-title{color:#94a3b8;text-decoration:line-through}.streak{color:#64748b;font-size:12px;white-space:nowrap}.streak b{color:#e77b36;font-weight:700}.iconbtn{b t}@keyframes pop{50%{transform:scale(1.16)}}@keyframes up{from{transform:translateY(8px);opacity:0}to{transform:translateY(0);opacity:1}}@media(max-width:900px){.sidebar{width:208px}.main{margin-left:208px;width:calc(100% - 208px);padding-inline:28px}.grid{grid-template-columns:1fr}.side-stack{grid-template-columns:1fr 1fr}.bars{gap:15px}}@media(max-width:650px){.sidebar{display:none}.main{margin:0;width:100%;padding:23px 17px 98px}.topline{margin-bottom:29px}.headrow{align-items:flex-start;gap:12px}.headrow h1{font-size:29px}.headrow .primary{padding:11px 12px;font-size:13px;white-space:nowrap}.grid{gap:15px}.focus-card{padding:19px 16px 13px}.side-stack{grid-template-columns:1fr}.streak-card,.week-card{padding:19px}.habit{gap:10px}.habit-meta{font-size:11px}.streak{font-size:11px}.mobile-nav{position:fixed;display:flex;z-index:3;bottom:0;left:0;right:0;height:70px;padding:7px 13px calc(7px + env(safe-area-inset-bottom));background:#fffffff2;backdrop-filter:blur(12px);border-top:1px solid var(--line);justify-content:space-around}.mobile-nav button{background:none;border:0;color:#94a3b8;display:grid;place-items:center;gap:2px;font-size:10px;font-weight:600;min-width:62px}.mobile-nav button.active{color:var(--brand)}.mobile-nav svg{width:20px;height:20px}.progress-panels{grid-template-columns:1fr 1fr}.progress-panels .stat:last-child{grid-column:span 2}.week-large .bars{gap:8px}.week-large .barbg{height:120px}.crumb{font-size:12px}.all-habit{padding:13px 10px}.all-habit .streak{display:none}}
</style></head><body><div id="app"></div><div id="modal-root"></div><div class="snack" id="snack" role="status" aria-live="polite"></div>
<script>
const icons={home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>',list:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01" stroke-linecap="round"/></svg>',chart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V5m0 14h17M8 15l4-4 3 2 5-7" stroke-linecap="round" stroke-linejoin="round"/></svg>',check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m5 12 4 4L19 6" stroke-linecap="round" stroke-linejoin="round"/></svg>',edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m16 4 4 4M4 20l4-.8L19 8a2.1 2.1 0 0 0-3-3L5 16z" stroke-linejoin="round"/></svg>',trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M10 11v6m4-6v6M5 7l1 13h12l1-13M9 7V4h6v3" stroke-linecap="round" stroke-linejoin="round"/></svg>'};
const todayKey=()=>new Date().toISOString().slice(0,10);const dateOffset=(n)=>{let d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
let state;try{state=JSON.parse(localStorage.getItem('daymark-state'))}catch{};if(!state||!state.habits)state={habits:[],page:'Today',onboarded:false,focus:''};
const save=()=>localStorage.setItem('daymark-state',JSON.stringify(state));const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const today=()=>todayKey();const doneToday=h=>h.completedDates.includes(today());
function streak(h){let s=0,d=new Date();while(h.completedDates.includes(d.toISOString().slice(0,10))||((h.frequency==='Weekly')&&s===0&&h.completedDates.some(x=>{let z=new Date(x);return Math.floor((d-z)/86400000)<7}))){if(h.frequency==='Weekly'){s++;d.setDate(d.getDate()-7)}else{s++;d.setDate(d.getDate()-1)}if(s>365)break}return s}
function best(h){if(!h.completedDates.length)return 0;let ds=[...new Set(h.completedDates)].sort();let max=1,n=1;for(let i=1;i<ds.length;i++){let diff=(new Date(ds[i])-new Date(ds[i-1]))/86400000;if(diff===(h.frequency==='Weekly'?7:1))n++;else n=1;max=Math.max(max,n)}return max}
function weekData(){return Array.from({length:7},(_,i)=>{let d=new Date();d.setDate(d.getDate()-6+i);let key=d.toISOString().slice(0,10);let due=state.habits.filter(h=>h.frequency==='Daily'||d.getDay()===1);let complete=due.filter(h=>h.completedDates.includes(key)).length;return {key,day:['Su','Mo','Tu','We','Th','Fr','Sa'][d.getDay()],pct:due.length?Math.round(complete/due.length*100):0}})}
const pctToday=()=>{let due=state.habits.filter(h=>h.frequency==='Daily'||new Date().getDay()===1);return due.length?Math.round(due.filter(doneToday).length/due.length*100):0};
function nav(){return `<aside class="sidebar"><div class="logo"><span class="logo-mark">${icons.check}</span>daymark</div><nav class="nav">${['Today','Habits','Progress'].map((x,i)=>`<button class="${state.page===x?'active':''}" onclick="go('${x}')">${[icons.home,icons.list,icons.chart][i]}${x}</button>`).join('')}</nav><div class="side-bottom"><strong>Small steps, every day.</strong>Your consistency is built one check-in at a time.</div></aside><nav class="mobile-nav">${['Today','Habits','Progress'].map((x,i)=>`<button class="${state.page===x?'active':''}" onclick="go('${x}')">${[icons.home,icons.list,icons.chart][i]}${x}</button>`).join('')}</nav>`}
function shell(content){return `${nav()}<main class="main"><div class="topline"><span class="crumb">Your space <span style="padding:0 6px;color:#cbd5e1">/</span> ${state.page}</span><div class="avatar" aria-label="Your profile">${state.focus?state.focus[0]: 'Y'}</div></div>${content}</main>`}
function header(title,sub,btn){return `<div class="headrow"><div><p class="eyebrow">${state.page==='Today'?'MONDAY MINDSET':'YOUR PERSONAL SPACE'}</p><h1>${title}</h1><p class="sub">${sub}</p></div>${btn||''}</div>`}
function addButton(text='+ Add habit'){return `<button class="primary" onclick="openForm()">${text}</button>`}
function weeklyBars(large=false){let data=weekData();return `<div class="${large?'week-large card':'week-card card'}"><div class="week-head"><h2>${large?'Your last 7 days':'This week'}</h2><span>${data.reduce((a,b)=>a+b.pct,0)?Math.round(data.reduce((a,b)=>a+b.pct,0)/7)+'% avg':'Just getting started'}</span></div><div class="bars">${data.map((x,i)=>`<div class="barcol"><div class="barbg" title="${x.pct}% complete"><div class="barfill ${i===6?'today':''}" style="height:${Math.max(x.pct,3)}%"></div></div><div class="barlabel">${x.day}</div></div>`).join('')}</div></div>`}
function todayPage(){let due=state.habits.filter(h=>h.frequency==='Daily'||new Date().getDay()===1),done=due.filter(doneToday).length,p=pctToday();let date=new Intl.DateTimeFormat('en',{weekday:'long',month:'long',day:'numeric'}).format(new Date());let body=state.habits.length?`<div class="grid"><section class="focus-card card"><div class="cardhead"><h2>Today’s focus</h2><span class="date-label">${date}</span></div>${p===100&&due.length?`<div class="complete-banner">${icons.check} You’re done for today. Beautiful work.</div>`:''}<div class="progress-row"><div class="track"><span style="width:${p}%"></span></div><span class="pct">${p}%</span></div><div class="habit-list">${due.length?due.map(h=>habitRow(h,false)).join(''):`<div class="empty"><div class="empty-icon">☀</div><h2>A lighter day</h2><p>Your weekly habits aren’t scheduled for today. Take a breath or add a daily habit.</p>${addButton()}</div>`}</div>${due.length?`<div class="hint">${done===0?'Your day is still open. You’ve got time to make progress.':p===100?'A little progress, repeated, adds up.':`Nice! ${due.length-done} ${due.length-done===1?'habit':'habits'} remaining.`}</div>`:''}</section><div class="side-stack"><section class="streak-card card"><h2>Your rhythm</h2><div class="streak-big"><div class="flame">🔥</div><div><div class="streak-num">${Math.max(0,...state.habits.map(streak))} <span style="font:500 14px 'DM Sans';color:#64748b">day streak</span></div><div class="streak-caption">Keep showing up for yourself</div></div></div><div class="streak-note">${state.habits.some(h=>h.completedDates.includes(dateOffset(-1)))?'Yesterday counts. Today is a fresh start.':'Missed yesterday? That’s okay. Start again today.'}</div></section>${weeklyBars()}</div></div>`:`<div class="card empty"><div class="empty-icon">✳</div><h2>Build your first habit</h2><p>Start small. Pick one thing you’d like to do consistently.</p>${addButton('+ Create your first habit')}</div>`;return shell(`${header('Make today count',`A little progress goes a long way. ${date}.`,addButton())}${body}`)}
function habitRow(h,manage){let done=doneToday(h);return `<div class="habit ${done?'done':''}">${manage?'':`<button class="check ${done?'done':''}" aria-label="${done?'Mark incomplete':'Complete '+esc(h.name)}" onclick="toggle('${h.id}')">${done?icons.check:''}</button>`}<div class="habit-info"><div class="habit-title">${esc(h.name)}</div><div class="habit-meta">${esc(h.category)} · ${esc(h.frequency.toLowerCase())}</div></div><span class="streak"><b>🔥 ${streak(h)}</b> ${streak(h)===1?'day':'days'}</span>${manage?`<div class="actions"><button class="iconbtn" title="Edit ${esc(h.name)}" aria-label="Edit ${esc(h.name)}" onclick="openForm('${h.id}')">${icons.edit}</button><button class="iconbtn" title="Delete ${esc(h.name)}" aria-label="Delete ${esc(h.name)}" onclick="confirmDelete('${h.id}')">${icons.trash}</button></div>`:''}</div>`}
function habitsPage(){let rows=state.habits.length?`<div class="card">${state.habits.map(h=>`<div class="all-habit">${habitRow(h,true)}</div>`).join('')}</div>`:`<div class="card empty"><div class="empty-icon">✳</div><h2>Build your first habit</h2><p>Start small. Pick one thing you’d like to do consistently.</p>${addButton('+ Create your first habit')}</div>`;return shell(`<div class="habits-page">${header('Your habits','A few meaningful rituals make a big difference.',addButton())}<p class="section-label">${state.habits.length?`${state.habits.length} ${state.habits.length===1?'habit':'habits'} in your routine`:''}</p>${rows}</div>`)}
function progressPage(){if(!state.habits.length)return shell(`${header('Your progress','Consistency grows one day at a time.') }<div class="card empty"><div class="empty-icon">↗</div><h2>Your progress starts today.</h2><p>Complete your first habit and we’ll start tracking your consistency.</p><button class="primary" onclick="go('Today')">View today’s habits</button></div>`);let completed=state.habits.reduce((n,h)=>n+h.completedDates.length,0),current=Math.max(0,...state.habits.map(streak)),record=Math.max(0,...state.habits.map(best));return shell(`${header('See how you’re growing','Every check-in is a small win worth counting.') }<div class="progress-panels"><div class="stat card"><label>Today complete</label><strong>${pctToday()}%</strong><small>Keep building your rhythm</small></div><div class="stat card"><label>Current streak</label><strong>${current} <span style="font-size:14px;font-weight:500">days</span></strong><small>Across your habits</small></div><div class="stat card"><label>Best streak</label><strong>${record} <span style="font-size:14px;font-weight:500">days</span></strong><small>${state.habits.length} habits · ${completed} check-ins</small></div></div>${weeklyBars(true)}<p class="hint" style="margin-top:13px">A missed day doesn’t erase the progress you’ve made. Pick up where you are.</p>`)}
function render(){document.getElementById('app').innerHTML=state.page==='Today'?todayPage():state.page==='Habits'?habitsPage():progressPage();save()}
function go(p){state.page=p;render();window.scrollTo(0,0)}let snackTimer;function toast(msg){let el=document.getElementById('snack');el.textContent=msg;el.classList.add('show');clearTimeout(snackTimer);snackTimer=setTimeout(()=>el.classList.remove('show'),2400)}
function toggle(id){let h=state.habits.find(x=>x.id===id);if(!h)return;let t=today(),was=doneToday(h);h.completedDates=was?h.completedDates.filter(d=>d!==t):[...h.completedDates,t];if(!was)toast(pctToday()===100?'You’re done for today. Beautiful work.':`Nice! ${state.habits.filter(x=>x.frequency==='Daily'||new Date().getDay()===1).filter(x=>!doneToday(x)).length} habits remaining.`);render()}
function openForm(id){let h=state.habits.find(x=>x.id===id);document.getElementById('modal-root').innerHTML=`<div class="modal-back" onclick="if(event.target===this)closeModal()"><form class="modal" onsubmit="submitHabit(event,'${id||''}')"><h2>${h?'Edit habit':'Create a habit'}</h2><p>Keep it simple. You can always adjust your routine later.</p><div class="field"><label for="hname">Habit name</label><input id="hname" name="name" maxlength="60" placeholder="e.g. Read for 20 minutes" value="${h?esc(h.name):''}" required autofocus></div><div class="field"><label for="hcat">Category</label><select id="hcat" name="category">${['Health','Learning','Productivity','Mindfulness','Personal'].map(x=>`<option ${h?.category===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label for="hfreq">Frequency</label><select id="hfreq" name="frequency">${['Daily','Weekly'].map(x=>`<option ${h?.frequency===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="modal-foot"><button type="button" class="secondary" onclick="closeModal()">Cancel</button><button type="submit" class="primary">${h?'Save changes':'Create habit'}</button></div></form></div>`;setTimeout(()=>document.getElementById('hname')?.focus(),0)}
function closeModal(){document.getElementById('modal-root').innerHTML=''}function submitHabit(e,id){e.preventDefault();let f=new FormData(e.target),values={name:f.get('name').trim(),category:f.get('category'),frequency:f.get('frequency')};if(id){Object.assign(state.habits.find(x=>x.id===id),values);toast('Habit updated.')}else{state.habits.push({id:crypto.randomUUID(),...values,createdAt:today(),completedDates:[]});toast('Your new habit is ready.')}closeModal();render()}
function confirmDelete(id){let h=state.habits.find(x=>x.id===id);document.getElementById('modal-root').innerHTML=`<div class="modal-back" onclick="if(event.target===this)closeModal()"><div class="modal"><h2>Delete this habit?</h2><p>“${esc(h.name)}” and its check-in history will be removed.</p><div class="modal-foot"><button class="secondary" onclick="closeModal()">Keep habit</button><button class="danger" onclick="deleteHabit('${id}')">Delete habit</button></div></div></div>`}function deleteHabit(id){state.habits=state.habits.filter(x=>x.id!==id);closeModal();render();toast('Habit deleted.')}
render();
</script></body></html>
